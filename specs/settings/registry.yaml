# Container registry credentials. A flat settings kind: eight fields, one write
# group, no hook. This is the cost target for ADR 0002.
#
# Live facts (captured on 0.30.6 and 0.30.7, fixtures/api/live/*/registry-*): create runs
# `docker login` and returns the whole object; `registry.all` lists the password but
# `registry.one` omits it; update returns `true` and is a patch, and a login Dokploy
# rejects still persists the change; names are not unique at Dokploy.
kind: registry
scope: settings
section: registries
title: Container registry
class: managed
identity:
  key: name
  collision: [name]
  address: "registry.{key}"
api:
  id: registryId
  create: { op: registry.create }
  update: { op: registry.update }
  remove: { op: registry.remove }
  read:
    list: { op: registry.all, authority: authoritative }
    one: { op: registry.one, id_param: registryId, agree: true }
  create_identity:
    from_response: /registryId
fields:
  name:
    api: registryName
    type: text
    min_len: 1
    default: key
    doc: Display name; defaults to the document key.
  type:
    api: registryType
    type: enum[cloud]
    doc: Registry flavour. Dokploy v0.30.6 accepts only `cloud`.
  url:
    api: registryUrl
    type: text
    doc: Registry host, such as ghcr.io.
  username:
    type: text
    min_len: 1
  password:
    type: text
    min_len: 1
    class: secret
    mutability: write_only
    doc: Sent when the secret changes; an update that omits it keeps the stored one.
  image_prefix:
    api: imagePrefix
    type: text
    nullable: true
    doc: Prefix prepended to image names pushed to this registry.
  server:
    api: serverId
    type: selector(server)
    nullable: true
    doc: Restrict the registry to one server.
write:
  - op: registry.update
    fields: [name, type, url, username, password, image_prefix, server]
    shape: partial
ledger:
  readonly: [createdAt, organizationId]
