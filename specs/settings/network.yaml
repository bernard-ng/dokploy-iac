# A Docker network Dokploy manages, which services attach to by name (`networks: [{ name: backend }]`).
# A flat settings kind with no update operation: Dokploy can create, recreate, resync, and remove a
# network, so every field is create-only and a change replaces it.
#
# Live facts (0.30.6 and 0.30.7, fixtures/api/live/*/network-contract.metadata.json): create answers
# the whole object and makes the Docker network, and an unset `ipam` is read back as `{}` (the live
# engine test shows it does not read as drift). `dockerId` stays null. A second network of the same
# name is a 400 (Docker's conflict), and remove answers the removed object and removes the Docker
# network. An overlay network needs Swarm and is a 400 without it; the integration instance does
# not run Swarm, so no overlay capture exists.
kind: network
scope: settings
section: networks
title: Network
class: managed
identity:
  key: name
  collision: [name]
  address: "network.{key}"
api:
  id: networkId
  create: { op: network.create }
  remove: { op: network.remove }
  read:
    list: { op: network.all, authority: authoritative }
    one: { op: network.one, id_param: networkId, agree: true }
  create_identity:
    diff_collection: { key: [name] }
fields:
  name:
    type: text
    min_len: 1
    default: key
    mutability: create_only
    doc: The Docker network name; defaults to the document key.
  driver:
    type: enum[bridge, overlay]
    mutability: create_only
  internal:
    type: bool
    mutability: create_only
    doc: No traffic leaves the network.
  attachable:
    type: bool
    mutability: create_only
  enable_ipv4:
    api: enableIPv4
    type: bool
    mutability: create_only
  enable_ipv6:
    api: enableIPv6
    type: bool
    mutability: create_only
  mtu:
    type: int
    min: 68
    max: 65535
    nullable: true
    mutability: create_only
  ipam:
    type: "blob(network-ipam)"
    nullable: true
    mutability: create_only
    doc: "IP address management as Docker's own JSON: `{ driver, config: [{ subnet, gateway, ipRange }] }`."
  server:
    api: serverId
    type: selector(server)
    nullable: true
    mutability: create_only
    doc: The server the network lives on; empty is the Dokploy host.
ledger:
  readonly: [createdAt, organizationId]
