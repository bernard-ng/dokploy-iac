# An S3-compatible backup destination. A flat settings kind: the backups and volume backups of the
# project kinds name one by selector.
#
# Live facts (0.30.6 and 0.30.7, fixtures/api/live/*/destination-contract.metadata.json): create
# and update answer the whole object, and `destination.all` and `destination.one` return both keys
# in clear (the fixtures redact them). `destination.update` requires every field, secrets included
# (a partial body is a 400), so its write group is `full` and the document must declare both
# secrets. Two destinations may share a name, so the identity stays the one new item of
# `destination.all` by name. Dokploy never contacts the endpoint on create or update. Removing a
# destination deletes the volume backups that name it, with no error (see `volume_backup`).
kind: destination
scope: settings
section: destinations
title: Backup destination
class: managed
identity:
  key: name
  collision: [name]
  address: "destination.{key}"
api:
  id: destinationId
  create: { op: destination.create }
  update: { op: destination.update }
  remove: { op: destination.remove }
  read:
    list: { op: destination.all, authority: authoritative }
    one: { op: destination.one, id_param: destinationId, agree: true }
  create_identity:
    diff_collection: { key: [name] }
fields:
  name:
    type: text
    min_len: 1
    default: key
    doc: Display name; defaults to the document key.
  provider:
    type: text
    nullable: true
    doc: The S3 provider, such as AWS or Cloudflare; empty for a generic S3 endpoint.
  access_key:
    api: accessKey
    type: text
    min_len: 1
    class: secret
    mutability: write_only
  secret_access_key:
    api: secretAccessKey
    type: text
    min_len: 1
    class: secret
    mutability: write_only
  bucket:
    type: text
    min_len: 1
  region:
    type: text
  endpoint:
    type: text
    min_len: 1
  additional_flags:
    api: additionalFlags
    type: "list<text>"
    nullable: true
    doc: Extra flags passed to rclone.
write:
  - op: destination.update
    fields: [name, provider, access_key, secret_access_key, bucket, region, endpoint, additional_flags]
    shape: full
ledger:
  readonly: [createdAt, organizationId]
  ignored:
    - { field: serverId, reason: "Dokploy 0.30.6 and 0.30.7 accept it and neither store it nor return it, so it cannot be managed" }
