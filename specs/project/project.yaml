# PROTOTYPE (coverage: partial). The root of a project document. Its tags are a relation
# (a hook) and arrive with the tag membership work.
kind: project
scope: project
section: project
title: Project
class: managed
coverage: partial
identity:
  key: name
  collision: [name]
  address: "project.{key}"
api:
  id: projectId
  create: { op: project.create }
  update: { op: project.update }
  remove: { op: project.remove }
  read:
    list: { op: project.all, authority: authoritative }
    one: { op: project.one, id_param: projectId, agree: true }
  create_identity:
    from_response: /project/projectId
fields:
  name:
    type: text
    min_len: 1
    default: key
  description:
    type: text
    nullable: true
  env:
    type: env
    granularity: key
    doc: Variables shared by everything below.
write:
  - op: project.update
    fields: [name, description, env]
    shape: partial
children:
  - { kind: environment, section: environments }
ledger:
  readonly: [createdAt, organizationId]
