# PROTOTYPE (coverage: partial). The root of a project document. Its tags are a relation: Dokploy
# assigns and removes one tag at a time, and the direct read holds them as `projectTags`.
#
# Live facts: `projectTags` is on `project.one` and `project.all` and has always been captured
# empty (`[]`), so the shape of one assigned tag has not been observed. The spec reads the id from
# a `tagId` key of each element; any other shape is an invalid response and blocks planning for
# the tags alone, so nothing is written on a guess. The live suite verifies it.
kind: project
scope: project
section: project
title: Project
class: managed
coverage: partial
identity:
  key: name
  collision: [name]
  address: "project.{key}"
api:
  id: projectId
  create: { op: project.create }
  update: { op: project.update }
  remove: { op: project.remove }
  read:
    list: { op: project.all, authority: authoritative }
    one: { op: project.one, id_param: projectId, agree: true }
  create_identity:
    from_response: /project/projectId
fields:
  name:
    type: text
    min_len: 1
    default: key
  description:
    type: text
    nullable: true
  env:
    type: env
    granularity: key
    doc: Variables shared by everything below.
  tags:
    api: /projectTags/*/tagId
    type: "set<selector(tag)>"
    granularity: key
    nullable: true
    membership:
      add: { op: tag.assignToProject, member: tagId }
      remove: { op: tag.removeFromProject, member: tagId }
    doc: The tags of the project, each named by a `tag` of the settings. A tag is added or removed one request at a time; a tag assigned elsewhere is not the document's to remove, and `[]` removes them all.
write:
  - op: project.update
    fields: [name, description, env]
    shape: partial
children:
  - { kind: environment, section: environments }
ledger:
  readonly: [createdAt, organizationId]
