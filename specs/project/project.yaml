# The root of a project document. Not enrolled in the generic conformance suite (coverage stays
# partial) because the suite cannot yet write a project root document; the engine tests cover its
# tags. Its tags are a relation: Dokploy assigns and removes one tag at a time, and the direct
# read holds them as `projectTags`.
#
# Live facts (0.30.6 and 0.30.7, fixtures/api/live/*/project-tag-contract.metadata.json):
# `projectTags` is on `project.one` and `project.all` as `[{ id, projectId, tagId, tag: {...} }]`;
# the spec reads the id from the `tagId` key of each element, and any other shape is an invalid
# response that blocks planning for the tags alone. `tag.assignToProject` answers the link row;
# assigning a tag twice is a 400, removing one that is not assigned is a success, removing a tag
# removes its links, and `project.create` and `project.update` ignore a `tagIds` field.
kind: project
scope: project
section: project
title: Project
class: managed
coverage: partial
identity:
  key: name
  collision: [name]
  address: "project.{key}"
api:
  id: projectId
  create: { op: project.create }
  update: { op: project.update }
  remove: { op: project.remove }
  read:
    list: { op: project.all, authority: authoritative }
    one: { op: project.one, id_param: projectId, agree: true }
  create_identity:
    from_response: /project/projectId
fields:
  name:
    type: text
    min_len: 1
    default: key
  description:
    type: text
    nullable: true
  env:
    type: env
    granularity: key
    doc: Variables shared by everything below.
  tags:
    api: /projectTags/*/tagId
    type: "set<selector(tag)>"
    granularity: key
    nullable: true
    membership:
      add: { op: tag.assignToProject, member: tagId }
      remove: { op: tag.removeFromProject, member: tagId }
    doc: The tags of the project, each named by a `tag` of the settings. A tag is added or removed one request at a time; a tag assigned elsewhere is not the document's to remove, and `[]` removes them all.
write:
  - op: project.update
    fields: [name, description, env]
    shape: partial
children:
  - { kind: environment, section: environments }
ledger:
  readonly: [createdAt, organizationId]
