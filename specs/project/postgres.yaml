# PROTOTYPE (coverage: partial). A database of an environment. The swarm settings and the
# networks are still unclassified requests.
#
# Live facts (fixtures/api/live/*/postgres-*): create answers the whole object, update answers
# `true`, remove answers the removed object, and the collection is the `postgres` array that
# the environment's direct read embeds (assumed from `project.one`: to verify in the live suite).
# Password changes after create go through `update` here; whether Dokploy applies them to a
# running database (it also has `changePassword`) is to be verified in the live suite.
kind: postgres
scope: project
parent: environment
section: postgres
title: Postgres database
class: managed
coverage: partial
identity:
  key: name
  collision: [name]
  address: "postgres.{key}"
api:
  id: postgresId
  create:
    op: postgres.create
    attach: { environmentId: parent_id }
  update: { op: postgres.update }
  remove: { op: postgres.remove }
  deploy: { op: postgres.deploy }
  read:
    list:
      embedded_in: { parent_op: environment.one, pointer: /postgres }
      authority: authoritative
    one: { op: postgres.one, id_param: postgresId }
  create_identity:
    from_response: /postgresId
fields:
  name:
    type: text
    min_len: 1
    default: key
  app_name:
    api: appName
    type: text
    mutability: create_only
    nullable: true
    doc: Dokploy's Docker-level name; generated when omitted.
  description:
    type: text
    nullable: true
  server:
    api: serverId
    type: selector(server)
    mutability: create_only
    nullable: true
  image:
    api: dockerImage
    type: text
    min_len: 1
  command:
    type: text
    nullable: true
    needs_deploy: true
  args:
    type: list<text>
    nullable: true
    needs_deploy: true
  database:
    api: databaseName
    type: text
    min_len: 1
  username:
    api: databaseUser
    type: text
    min_len: 1
  password:
    api: databasePassword
    type: text
    min_len: 1
    class: secret
    mutability: write_only
    needs_deploy: true
  resources:
    type: struct
    granularity: field
    needs_deploy: true
    members:
      memory_limit: { api: memoryLimit, type: text, nullable: true }
      memory_reservation: { api: memoryReservation, type: text, nullable: true }
      cpu_limit: { api: cpuLimit, type: text, nullable: true }
      cpu_reservation: { api: cpuReservation, type: text, nullable: true }
  environment:
    api: env
    type: env
    granularity: key
    nullable: true
    needs_deploy: true
  detach_dokploy_network:
    api: detachDokployNetwork
    type: bool
  external_port:
    api: externalPort
    type: int
    min: 1
    max: 65535
    nullable: true
  replicas:
    type: int
    min: 0
    needs_deploy: true
write:
  - op: postgres.update
    fields: [name, description, image, command, args, database, username, password, resources, detach_dokploy_network, external_port, replicas]
    shape: partial
  - op: postgres.saveEnvironment
    fields: [environment]
    shape: partial
ledger:
  readonly: [createdAt, applicationStatus]
children:
  - { kind: mount, section: mounts }
