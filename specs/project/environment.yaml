# An environment of a project. Its duplication is not configuration.
#
# Live facts (0.30.6 and 0.30.7): `project.create` makes an environment of its own, `production`,
# with `isDefault: true` and the description "Production environment", and `environment.create` of
# a second `production` is refused. A document that declares `production` therefore takes that one
# (`made_with_parent`) and writes what it says with an update.
kind: environment
scope: project
parent: project
section: environments
title: Environment
class: managed
coverage: full
made_with_parent: { name: production, marker: is_default }
identity:
  key: name
  collision: [name]
  address: "environment.{key}"
api:
  id: environmentId
  create:
    op: environment.create
    attach: { projectId: parent_id }
  update: { op: environment.update }
  remove: { op: environment.remove }
  read:
    list: { op: environment.byProjectId, authority: authoritative, scope: { param: projectId } }
    one: { op: environment.one, id_param: environmentId, agree: true }
  create_identity:
    from_response: /environmentId
fields:
  name:
    type: text
    min_len: 1
    default: key
  description:
    type: text
    nullable: true
    doc: Dokploy reads `null` for an environment made without one and takes only a text, so write an empty text to clear it (live capture, 0.30.6).
  env:
    type: env
    granularity: key
    doc: Variables shared by everything below.
  is_default:
    api: isDefault
    type: bool
    mutability: computed
    doc: True for the environment Dokploy made with the project; read, never written.
write:
  - op: environment.update
    fields: [name, description, env]
    shape: partial
children:
  - { kind: application, section: applications }
  - { kind: postgres, section: postgres }
  - { kind: mysql, section: mysql }
  - { kind: mariadb, section: mariadb }
  - { kind: mongo, section: mongo }
  - { kind: redis, section: redis }
  - { kind: libsql, section: libsql }
  - { kind: compose, section: compose }
