name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show pinned Rust toolchain
        run: rustc --version --verbose

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --all-features --locked

      - name: Check kind specs against the OpenAPI contract
        run: cargo xtask specs --check

      - name: Check the legacy-test ledger
        run: cargo xtask goldens --check

      - name: Check the supported Dokploy versions
        run: cargo xtask versions --check

  generated-sdk:
    name: Generated SDK compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Compile generated API bindings independently
        run: cargo check --package dokploy-api --all-targets --all-features --locked

  contracts:
    name: Static contract validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned OpenAPI generator
        run: cargo install oas3-gen --version 0.28.0 --locked

      - name: Verify generated API bindings
        run: cargo xtask codegen --check

      - name: Audit vendored OpenAPI contract
        run: ./scripts/audit-openapi.sh

      - name: Validate integration Compose configuration
        run: docker compose --file compose.integration.yaml config --quiet

      - name: Test the fixture checker modes
        run: scripts/integration/test-fixture-check-modes.sh

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check advisories, licenses, bans, and sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2, cargo-deny 0.20.2
        with:
          arguments: --all-features --locked
          command: check
          rust-version: "1.97.1"

      - name: Install pinned RustSec cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit locked dependencies against RustSec advisories
        run: cargo audit

  distribution:
    name: Distribution contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned cargo-dist
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --location --silent --show-error --fail \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.33.0/cargo-dist-installer.sh \
            | sh

      - name: Verify generated release workflow
        run: dist generate --mode=ci --check

      - name: Validate release plan
        run: dist plan

  integration:
    name: Dokploy apply and convergence
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start digest-pinned Dokploy
        run: scripts/integration/up.sh

      - name: Create an ephemeral fingerprint key
        shell: bash
        run: |
          printf 'DOKPLOY_FINGERPRINT_KEY=0199a0c8-2351-7c31-8899-2c8f81983ea5:%s\n' \
            "$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Apply and verify convergence
        run: scripts/integration/test-apply.sh

      - name: Reset disposable Dokploy stack
        if: ${{ always() }}
        run: scripts/integration/reset.sh

  engine-live:
    name: Engine against Dokploy ${{ matrix.version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        version: ["0.30.6", "0.30.7"]
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve the digest-pinned image
        env:
          VERSION: ${{ matrix.version }}
        run: |
          image="$(cargo xtask versions --image "$VERSION")"
          {
            echo "DOKPLOY_VERSION=v$VERSION"
            echo "DOKPLOY_IMAGE=$image"
          } >> "$GITHUB_ENV"

      - name: Start the pinned Dokploy
        run: scripts/integration/up.sh

      - name: Create an ephemeral fingerprint key
        shell: bash
        run: |
          printf 'DOKPLOY_FINGERPRINT_KEY=0199a0c8-2351-7c31-8899-2c8f81983ea5:%s\n' \
            "$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Run the engine against it
        run: scripts/integration/test-engine-live.sh

      - name: Reset disposable Dokploy stack
        if: ${{ always() }}
        run: scripts/integration/reset.sh
