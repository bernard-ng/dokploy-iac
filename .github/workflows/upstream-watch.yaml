name: Upstream Dokploy contract watch

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: upstream-dokploy-contract-watch
  cancel-in-progress: false

jobs:
  contract:
    name: Check the latest Dokploy contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve the latest Dokploy release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/Dokploy/dokploy/releases/latest --jq .tag_name)"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unexpected Dokploy release tag: $tag" >&2
            exit 1
          fi
          echo "DOKPLOY_UPSTREAM_TAG=$tag" >> "$GITHUB_ENV"

      - name: Download the matching official SDK contract
        run: |
          curl --proto '=https' --tlsv1.2 --location --silent --show-error --fail \
            "https://raw.githubusercontent.com/Dokploy/sdk/${DOKPLOY_UPSTREAM_TAG}/openapi.json" \
            --output "$RUNNER_TEMP/dokploy-openapi.json"

      - name: Check the kind ledger against upstream
        id: ledger
        continue-on-error: true
        run: |
          cargo xtask specs --check --against "$RUNNER_TEMP/dokploy-openapi.json" \
            2>&1 | tee "$RUNNER_TEMP/spec-report.txt"

      - name: Open or update the drift issue
        if: ${{ steps.ledger.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Dokploy ${DOKPLOY_UPSTREAM_TAG} OpenAPI drift"
          report="$RUNNER_TEMP/spec-report.txt"
          body="$RUNNER_TEMP/issue-body.md"
          {
            echo "The scheduled upstream check found fields or operations that the kind ledger does not classify."
            echo
            echo "Release: \`${DOKPLOY_UPSTREAM_TAG}\`"
            echo
            echo '```text'
            head -c 50000 "$report"
            echo
            echo '```'
          } > "$body"
          issue="$(gh issue list --state open --search "${title} in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$issue" ]]; then
            gh issue comment "$issue" --body-file "$body"
          else
            gh issue create --title "$title" --body-file "$body"
          fi

      - name: Fail on unclassified upstream changes
        if: ${{ steps.ledger.outcome == 'failure' }}
        run: exit 1
