name: Dokploy apply example

on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: Run ID of the approved Dokploy plan workflow
        required: true
        type: string

permissions:
  actions: read
  contents: read

# This must match the plan workflow. Never let two jobs mutate the same state
# workspace concurrently.
concurrency:
  group: dokploy-iac-production-state
  cancel-in-progress: false

env:
  DOKPLOY_WORKSPACE: /var/lib/dokploy-iac/production

jobs:
  apply:
    # Configure required reviewers and deployment restrictions on this GitHub
    # Environment before enabling the workflow.
    environment: production
    runs-on: [self-hosted, linux, dokploy-iac-production]
    timeout-minutes: 30
    env:
      DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
      DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
      DOKPLOY_FINGERPRINT_KEY: ${{ secrets.DOKPLOY_FINGERPRINT_KEY }}
    steps:
      - name: Download approved saved plan
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.1
        with:
          name: dokploy-plan-${{ inputs.plan_run_id }}
          path: ${{ runner.temp }}/dokploy-approved-plan
          github-token: ${{ github.token }}
          run-id: ${{ inputs.plan_run_id }}

      - name: Resolve planned source revision
        id: planned-source
        shell: bash
        run: |
          sha="$(tr -d '\r\n' < "$RUNNER_TEMP/dokploy-approved-plan/dokploy-source-sha")"
          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The approved plan artifact contains an invalid source revision." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out reviewed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: source
          persist-credentials: false
          ref: ${{ steps.planned-source.outputs.sha }}

      - name: Build reviewed source
        run: cargo build --manifest-path source/Cargo.toml --release --locked --package dokploy-cli

      - name: Refresh configuration without replacing state
        shell: bash
        run: |
          install -d -m 0700 "$DOKPLOY_WORKSPACE"
          install -m 0600 source/dokploy.yaml "$DOKPLOY_WORKSPACE/dokploy.yaml"

      # Apply obtains the workspace writer lock, computes a fresh plan, and
      # rejects the reviewed envelope if configuration, state, or Dokploy
      # changed since the plan workflow.
      - name: Revalidate and apply the approved plan
        run: |
          source/target/release/dokploy apply \
            "$RUNNER_TEMP/dokploy-approved-plan/dokploy-saved-plan.json" \
            --file "$DOKPLOY_WORKSPACE/dokploy.yaml" \
            --auto-approve
