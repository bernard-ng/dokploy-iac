[workspace]
members = [
    "crates/dokploy-api",
    "crates/dokploy-cli",
    "crates/dokploy-conformance",
    "crates/dokploy-core",
    "crates/dokploy-engine",
    "crates/dokploy-model",
    "crates/dokploy-sdk",
    "crates/dokploy-sim",
    "crates/dokploy-spec",
    "crates/dokploy-state",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/bernard-ng/dokploy-iac"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.48", features = ["derive"] }
clap_complete = "4.6.11"
directories = "6.0.0"
dokploy-api = { path = "crates/dokploy-api", version = "0.1.0" }
dokploy-conformance = { path = "crates/dokploy-conformance", version = "0.1.0" }
dokploy-core = { path = "crates/dokploy-core", version = "0.1.0" }
dokploy-engine = { path = "crates/dokploy-engine", version = "0.1.0" }
dokploy-model = { path = "crates/dokploy-model", version = "0.1.0" }
dokploy-sdk = { path = "crates/dokploy-sdk", version = "0.1.0" }
dokploy-sim = { path = "crates/dokploy-sim", version = "0.1.0" }
dokploy-spec = { path = "crates/dokploy-spec", version = "0.1.0" }
dokploy-state = { path = "crates/dokploy-state", version = "0.1.0" }
fs4 = { version = "1.1.0", features = ["sync"] }
getrandom = "0.4.3"
hmac = "0.12.1"
inquire = "0.9.4"
keyring = { version = "3.6.3", features = ["apple-native", "crypto-rust", "sync-secret-service", "windows-native"] }
miette = { version = "7.6.0", features = ["fancy"] }
petgraph = "=0.8.3"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
rustix = { version = "1.1.5", features = ["fs"] }
schemars = "1.2.2"
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde-saphyr = { version = "1.3.0", default-features = false, features = ["deserialize"] }
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.16"
tokio = "1.53.1"
toml_edit = "0.23.6"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"
uuid = { version = "1.18.1", features = ["serde", "v4"] }
zeroize = "1.8.2"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
